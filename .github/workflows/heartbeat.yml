name: heartbeat
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # every 10 min, off the :00/:10 boundaries GitHub delays or drops under load
  workflow_dispatch:
    inputs:
      drill:
        description: "none, or both-down to open a [drill] issue (nobody assigned)"
        required: false
        default: "none"
permissions:
  contents: read
  issues: write
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe the VPS, read the Mini's beat, open/close the both-down issue
        run: ./check.sh
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          MINI_BEAT: ${{ vars.MINI_BEAT }}
          DRILL: ${{ inputs.drill || 'none' }}
